# MeOOH settings used for the UM-RR model in the paper.
# Atom order in seed.xyz: C O O H H H H.
paths:
  freq_output: freq.out
  scan_dir: qchem_scan
  output_dir: generated
sampling:
  coordinate_system: internal
  num_samples: 10000
  temperature_kelvin: 298.0
  random_seed: 61015
internal_coordinates:
  model: minima
  coordinate_construction: direct
  basin_interpolation: hard
  scan_extension_factor: 1.35
  scan_max_extensions: 8
  scan_max_harmonic_energy_factor: 4.0
  scan_nonrotor_dihedral_limit_deg: 150.0
  boundary_probability_tolerance: 0.001
  validation_points: 0
pes:
  num_scan_points: 25
  scan_energy_range_hartree: 0.3
schrodinger:
  grid_points: 5000
  num_states: 20
relaxed_torsion:
  enabled: true
  sample: true
  atom_indices: [1, 2, 3, 7]  # One-based C--O--O--H indices.
  scan_dir: relaxed_rotor_scan
  scan_input: rotor_opt.in
  scan_output: rotor_opt.out
  scan_start_deg: 180.0
  scan_end_deg: -180.0
  scan_step_deg: 10.0
  write_scan_input: true
  run_qchem: true
  scan_command_template: "qchem -nt 8 {input} {output}"
  skip_existing_outputs: true
  minimum_dir: relaxed_torsion_minima
  write_minimum_inputs: true
  run_minimum_jobs: true
  num_states: 20
  population_tail_tolerance: 0.01
  rmsd_threshold_angstrom: 0.15
qchem:
  charge: 0
  multiplicity: 1
  num_processors: 8  # Eight independent one-core jobs during transverse scans.
  run_jobs: true
  skip_existing_outputs: true
  command_template: "qchem -nt 1 {input} {output}"
  input_template: |
    $molecule
    {charge} {multiplicity}
    {geometry_angstrom}
    $end

    $rem
    METHOD RIMP2
    BASIS aug-cc-pVDZ
    AUX_BASIS RIMP2-aug-cc-pVDZ
    N_FROZEN_CORE fc
    SCF_CONVERGENCE 9
    THRESH 14
    MAX_SCF_CYCLES 300
    SCF_ALGORITHM diis_gdm
    VIBMAN_PRINT 4
    GEOM_OPT_MAX_CYCLES 200
    MEM_TOTAL 3000
    MEM_STATIC 256
    SYM_IGNORE true
    SYMMETRY false
    $end
output:
  write_spline_plots: true
  write_relaxed_torsion_plots: true
  write_normal_mode_wavefunction_plots: true
  write_sharc_strings: false
