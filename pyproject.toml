[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UMRR"
version = "0.1.0"
description = "UM-RR: quasiclassical initial conditions from relaxed rotors and independent anharmonic vibrations."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "UMRR Developers"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "rmsd>=1.5",
  "geometric>=1.1,<2"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.9"]

[project.scripts]
UMRR = "UMRR.cli:main"
UMRR-qchem-run = "UMRR.qchem_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
UMRR = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
